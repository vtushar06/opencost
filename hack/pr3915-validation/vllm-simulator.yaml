apiVersion: v1
kind: ConfigMap
metadata:
  name: namespace-info
  namespace: llm-d
data:
  uid: "llm-d-namespace-uid-12345"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-model-server
  namespace: llm-d
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-model-server
      llm-d.ai/model: "Llama-3.1-8B"
  template:
    metadata:
      labels:
        app: llama-model-server
        llm-d.ai/model: "Llama-3.1-8B"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: simulator
        image: ghcr.io/llm-d/llm-d-inference-sim:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 8000
          name: metrics
        env:
        - name: MODEL_NAME
          value: "Llama-3.1-8B"
        - name: PORT
          value: "8000"
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: llama-model-server
  namespace: llm-d
spec:
  type: NodePort
  selector:
    app: llama-model-server
    llm-d.ai/model: "Llama-3.1-8B"
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30080
    name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-model-server
  namespace: llm-d
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen-model-server
      llm-d.ai/model: "Qwen/Qwen3-32B"
  template:
    metadata:
      labels:
        app: qwen-model-server
        llm-d.ai/model: "Qwen/Qwen3-32B"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: simulator
        image: ghcr.io/llm-d/llm-d-inference-sim:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 8000
          name: metrics
        env:
        - name: MODEL_NAME
          value: "Qwen/Qwen3-32B"
        - name: PORT
          value: "8000"
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: qwen-model-server
  namespace: llm-d
spec:
  selector:
    app: qwen-model-server
    llm-d.ai/model: "Qwen/Qwen3-32B"
  ports:
  - port: 8000
    targetPort: 8000
    name: http
